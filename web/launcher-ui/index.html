<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SE1 Roleplay Communities</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">SE1 ROLEPLAY NETWORK</p>
      <h1>Find your community.</h1>
      <p class="intro">Browse roleplay servers and connect through the desktop launcher.</p>
    </header>
    <section class="toolbar" aria-label="Server controls">
      <label for="search">Search communities</label>
      <input id="search" type="search" placeholder="Name, region, or description">
      <button id="refresh" type="button">Refresh</button>
    </section>
    <p id="status" role="status">Waiting for the C# launcher connection…</p>
    <section id="servers" class="servers" aria-live="polite"></section>
  </main>
</body>
</html>
