name: Build SE1 Roleplay Launcher Installer

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-installer.yml"
  push:
    branches:
      - main
    tags:
      - "launcher-v*"
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-installer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Build self-contained launcher installer
        shell: pwsh
        env:
          LAUNCHER_COMMIT_SHA: ${{ github.sha }}
        run: ./launcher/installer/build-installer.ps1

      - name: Verify installer and generate update metadata
        shell: pwsh
        run: |
          $installer = Get-Item "./launcher/artifacts/SE1-RP-Launcher-Setup-0.2.0-x64.exe" -ErrorAction Stop
          if ($installer.Length -lt 1MB) {
            throw "Installer is unexpectedly small ($($installer.Length) bytes)."
          }

          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5A4D) {
              throw "Installer does not have a valid Windows executable header."
            }
          }
          finally {
            $stream.Dispose()
          }

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "$($installer.FullName).sha256"

          @{
            version = "0.2.0"
            commit = "${{ github.sha }}"
            channel = "development"
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8NoBOM "./launcher/artifacts/launcher-update.json"

          Write-Host "Verified $($installer.Name) ($([math]::Round($installer.Length / 1MB, 2)) MB)"
          Write-Host "SHA256: $hash"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: SE1-RP-Launcher-Windows-x64
          path: |
            launcher/artifacts/SE1-RP-Launcher-Setup-0.2.0-x64.exe
            launcher/artifacts/SE1-RP-Launcher-Setup-0.2.0-x64.exe.sha256
            launcher/artifacts/launcher-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Move development release tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git tag -f launcher-dev "$GITHUB_SHA"
          git push --force origin refs/tags/launcher-dev

      - name: Publish or update rolling development release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: launcher-dev
          name: SE1 Roleplay Launcher - Latest Development Build
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Automatically updated from the latest successful push to main that changes the launcher.
            This is a development build and may contain unfinished features.
          files: |
            launcher/artifacts/SE1-RP-Launcher-Setup-0.2.0-x64.exe
            launcher/artifacts/SE1-RP-Launcher-Setup-0.2.0-x64.exe.sha256
            launcher/artifacts/launcher-update.json

      - name: Publish versioned launcher release
        if: startsWith(github.ref, 'refs/tags/launcher-v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          overwrite_files: true
          files: |
            launcher/artifacts/SE1-RP-Launcher-Setup-0.2.0-x64.exe
            launcher/artifacts/SE1-RP-Launcher-Setup-0.2.0-x64.exe.sha256
            launcher/artifacts/launcher-update.json
