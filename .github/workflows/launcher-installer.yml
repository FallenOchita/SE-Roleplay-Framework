name: Build SE1 Roleplay Launcher Installer

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'launcher-v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
      - name: Publish and package
        shell: pwsh
        run: ./launcher/installer/build-installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: SE1-RP-Launcher-Windows-x64
          path: launcher/artifacts/*.exe
          if-no-files-found: error
      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: launcher/artifacts/*.exe
