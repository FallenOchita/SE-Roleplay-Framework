name: Build Launcher

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    paths: ["launcher/**", ".github/workflows/build-launcher.yml"]
  pull_request:
    paths: ["launcher/**", ".github/workflows/build-launcher.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build SE1 WPF launcher
        run: dotnet build launcher/SE.Roleplay.Framework.Launcher/SE.Roleplay.Framework.Launcher.csproj --configuration Release
